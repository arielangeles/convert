name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build (universal)
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Unit tests
        run: ./scripts/test.sh

      - name: Build app bundle
        run: UNIVERSAL=1 ./scripts/build.sh --no-install

      - name: Verify bundle
        run: |
          set -euo pipefail
          APP=build/Convert.app
          ARCHS="$(lipo -archs "$APP/Contents/MacOS/Convert")"
          echo "Architectures: $ARCHS"
          [[ "$ARCHS" == *arm64* && "$ARCHS" == *x86_64* ]] || { echo "::error::Not universal"; exit 1; }
          codesign --verify --deep --strict "$APP"
          plutil -lint "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSServices:0:NSMessage" "$APP/Contents/Info.plist"
