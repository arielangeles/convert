name: Release

# Cut a release by pushing a semver tag:
#   git tag v1.0.0 && git push origin v1.0.0
# Or re-run for an existing tag from the Actions tab (workflow_dispatch).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v1.0.0"
        required: true

permissions:
  contents: write # create the release and upload assets

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not semver (expected vX.Y.Z)"; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build universal app
        run: |
          VERSION="${TAG#v}" BUILD_NUMBER="${{ github.run_number }}" UNIVERSAL=1 \
            ./scripts/build.sh --no-install

      - name: Verify bundle
        run: |
          set -euo pipefail
          APP=build/Convert.app
          ARCHS="$(lipo -archs "$APP/Contents/MacOS/Convert")"
          echo "Architectures: $ARCHS"
          [[ "$ARCHS" == *arm64* && "$ARCHS" == *x86_64* ]] || { echo "::error::Not universal"; exit 1; }
          codesign --verify --deep --strict "$APP"
          V="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          [[ "$V" == "${TAG#v}" ]] || { echo "::error::Bundle version $V != tag $TAG"; exit 1; }

      - name: Package
        run: |
          set -euo pipefail
          ZIP="Convert-${TAG}-macOS-universal.zip"
          # ditto keeps the bundle's symlinks, permissions and signature intact (plain zip can break them).
          ditto -c -k --sequesterRsrc --keepParent build/Convert.app "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PRERELEASE=()
          [[ "$TAG" == *-* ]] && PRERELEASE=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists, replacing assets."
            gh release upload "$TAG" "$ZIP" "$ZIP.sha256" --clobber
          else
            gh release create "$TAG" "$ZIP" "$ZIP.sha256" \
              --title "Convert ${TAG}" \
              --notes-file .github/release-notes.md \
              --generate-notes \
              --verify-tag \
              ${PRERELEASE[@]+"${PRERELEASE[@]}"}
          fi
